# SelfClaw with Feishu Adapter
# Usage: docker-compose up -d

version: '3.8'

services:
  gateway:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      NODE_ENV: production
      # Feishu Integration
      FEISHU_ENABLED: "${FEISHU_ENABLED:-false}"
      FEISHU_APP_ID: "${FEISHU_APP_ID}"
      FEISHU_APP_SECRET: "${FEISHU_APP_SECRET}"
      FEISHU_WEBHOOK_SECRET: "${FEISHU_WEBHOOK_SECRET}"
      FEISHU_DEFAULT_IDENTITY: "${FEISHU_DEFAULT_IDENTITY:-bot}"
      # Gateway Configuration
      GATEWAY_PORT: 8080
      GATEWAY_HOST: 0.0.0.0
    volumes:
      - lark-cli-config:/root/.lark-cli
      - ./packages:/app/packages:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    networks:
      - selfclaw-network

  # Redis for caching and session management
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped
    networks:
      - selfclaw-network

volumes:
  lark-cli-config:
    driver: local
  redis-data:
    driver: local

networks:
  selfclaw-network:
    driver: bridge
