# SelfClaw with Feishu Adapter
# Usage: docker-compose up -d

version: '3.8'

services:
  gateway:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      NODE_ENV: production
      # Feishu Integration
      FEISHU_ENABLED: "${FEISHU_ENABLED:-false}"
      FEISHU_APP_ID: "${FEISHU_APP_ID}"
      FEISHU_APP_SECRET: "${FEISHU_APP_SECRET}"
      FEISHU_WEBHOOK_SECRET: "${FEISHU_WEBHOOK_SECRET}"
      FEISHU_DEFAULT_IDENTITY: "${FEISHU_DEFAULT_IDENTITY:-bot}"
      # Gateway Configuration
      GATEWAY_PORT: 8080
      GATEWAY_HOST: 0.0.0.0
    volumes:
      - lark-cli-config:/root/.lark-cli
      - ./packages:/app/packages:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    networks:
      - selfclaw-network

  # Redis for caching and session management
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped
    networks:
      - selfclaw-network

  # Evolution Harness v2.0 - Skill Audit + Optimize + Lifecycle
  evolution:
    build:
      context: ./packages/evolution
      dockerfile: Dockerfile
    ports:
      - "8084:8084"
    environment:
      NODE_ENV: production
      PORT: 8084
      # Skill Audit Config
      CONTEXT_TOKENS: "${CONTEXT_TOKENS:-272000}"
      BUDGET_PERCENT: "${BUDGET_PERCENT:-2}"
      SKILL_ROOTS: "/app/packages/skills"
      # Memory Service for usage tracking
      MEMORY_SERVICE_URL: "http://memory:8082"
    volumes:
      - ./packages/skills:/app/packages/skills:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8084/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    networks:
      - selfclaw-network

  # Market Research Service - Agent World 技能市场调研
  market-research:
    build:
      context: .
      dockerfile: docker/market-research.Dockerfile
    environment:
      NODE_ENV: production
      RESEARCH_SCHEDULE: "${RESEARCH_SCHEDULE:-0 9 * * *}"
      PUSH_ENABLED: "${PUSH_ENABLED:-true}"
      FEISHU_WEBHOOK: "${FEISHU_WEBHOOK}"
    volumes:
      - ./packages:/app/packages:ro
      - research-data:/app/data
    restart: unless-stopped
    networks:
      - selfclaw-network

volumes:
  lark-cli-config:
    driver: local
  redis-data:
    driver: local
  research-data:
    driver: local

networks:
  selfclaw-network:
    driver: bridge
