version: '3.8'

services:
  # ============================================
  # Infrastructure Services
  # ============================================
  
  postgres:
    image: postgres:16-alpine
    container_name: selfclaw-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-selfclaw}
      POSTGRES_USER: ${POSTGRES_USER:-selfclaw}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-selfclaw123}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U selfclaw"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - selfclaw-network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: selfclaw-redis
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis123} --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - selfclaw-network
    restart: unless-stopped

  # ============================================
  # Monitoring Stack
  # ============================================
  
  prometheus:
    image: prom/prometheus:latest
    container_name: selfclaw-prometheus
    volumes:
      - ../monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    networks:
      - selfclaw-network
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: selfclaw-grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin123}
    volumes:
      - grafana_data:/var/lib/grafana
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    depends_on:
      - prometheus
    networks:
      - selfclaw-network
    restart: unless-stopped

  # ============================================
  # Core Services
  # ============================================
  
  gateway:
    build:
      context: ..
      dockerfile: docker/gateway.Dockerfile
    container_name: selfclaw-gateway
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - PORT=${GATEWAY_PORT:-8080}
      - WS_PORT=${WS_PORT:-9000}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-selfclaw}:${POSTGRES_PASSWORD:-selfclaw123}@postgres:5432/${POSTGRES_DB:-selfclaw}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-redis123}@redis:6379
      - JWT_SECRET=${JWT_SECRET:-selfclaw-super-secret-jwt-key-2026}
      - LOG_LEVEL=${LOG_LEVEL:-info}
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
      - "${WS_PORT:-9000}:9000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ../logs:/app/logs
    networks:
      - selfclaw-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  query-engine:
    build:
      context: ..
      dockerfile: docker/query-engine.Dockerfile
    container_name: selfclaw-query-engine
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - PORT=${QUERY_ENGINE_PORT:-8081}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-selfclaw}:${POSTGRES_PASSWORD:-selfclaw123}@postgres:5432/${POSTGRES_DB:-selfclaw}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-redis123}@redis:6379
      - OPENAI_API_KEY=${OPENAI_API_KEY:-mock-key}
      - LLM_PROVIDER=${LLM_PROVIDER:-mock}
    ports:
      - "${QUERY_ENGINE_PORT:-8081}:8081"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ../logs:/app/logs
    networks:
      - selfclaw-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  memory-system:
    build:
      context: ..
      dockerfile: docker/memory.Dockerfile
    container_name: selfclaw-memory
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - PORT=${MEMORY_PORT:-8082}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-selfclaw}:${POSTGRES_PASSWORD:-selfclaw123}@postgres:5432/${POSTGRES_DB:-selfclaw}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-redis123}@redis:6379
    ports:
      - "${MEMORY_PORT:-8082}:8082"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ../logs:/app/logs
    networks:
      - selfclaw-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  permission-system:
    build:
      context: ..
      dockerfile: docker/permission.Dockerfile
    container_name: selfclaw-permission
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - PORT=${PERMISSION_PORT:-8083}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-selfclaw}:${POSTGRES_PASSWORD:-selfclaw123}@postgres:5432/${POSTGRES_DB:-selfclaw}
      - JWT_SECRET=${JWT_SECRET:-selfclaw-super-secret-jwt-key-2026}
    ports:
      - "${PERMISSION_PORT:-8083}:8083"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ../logs:/app/logs
    networks:
      - selfclaw-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8083/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  evolution-harness:
    build:
      context: ..
      dockerfile: docker/evolution.Dockerfile
    container_name: selfclaw-evolution
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - PORT=${EVOLUTION_PORT:-8084}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-selfclaw}:${POSTGRES_PASSWORD:-selfclaw123}@postgres:5432/${POSTGRES_DB:-selfclaw}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-redis123}@redis:6379
    ports:
      - "${EVOLUTION_PORT:-8084}:8084"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ../logs:/app/logs
    networks:
      - selfclaw-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8084/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  soul-module:
    build:
      context: ..
      dockerfile: docker/soul.Dockerfile
    container_name: selfclaw-soul
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - PORT=${SOUL_PORT:-8085}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-selfclaw}:${POSTGRES_PASSWORD:-selfclaw123}@postgres:5432/${POSTGRES_DB:-selfclaw}
    ports:
      - "${SOUL_PORT:-8085}:8085"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ../logs:/app/logs
    networks:
      - selfclaw-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8085/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ============================================
  # Web UI
  # ============================================
  
  web-ui:
    build:
      context: ..
      dockerfile: docker/webui.Dockerfile
    container_name: selfclaw-web-ui
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - PORT=${WEB_UI_PORT:-80}
      - API_BASE_URL=http://gateway:8080
      - WS_URL=ws://localhost:9000
    ports:
      - "${WEB_UI_PORT:-80}:80"
    depends_on:
      - gateway
    networks:
      - selfclaw-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/"]
      interval: 30s
      timeout: 10s
      retries: 3

# ============================================
# Volumes
# ============================================

volumes:
  postgres_data:
    name: selfclaw_postgres_data
  redis_data:
    name: selfclaw_redis_data
  prometheus_data:
    name: selfclaw_prometheus_data
  grafana_data:
    name: selfclaw_grafana_data

# ============================================
# Networks
# ============================================

networks:
  selfclaw-network:
    name: selfclaw-network
    driver: bridge
